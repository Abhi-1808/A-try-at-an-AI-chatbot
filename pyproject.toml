[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "hope-brain"
version = "0.1.0"
description = "Offline first Project Hope companion brain"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.20.2,<2"]
anthropic = ["anthropic==2.3.0"]
local = ["httpx2==2.16.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/hope_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100


[tool.mypy]
python_version = "3.12"
files = ["src/hope_brain"]
check_untyped_defs = true
# Pydantic 2.14 uses TypeForm for annotated union schemas.
enable_incomplete_feature = ["TypeForm"]
